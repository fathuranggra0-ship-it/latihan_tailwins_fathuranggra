
<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova AI - Landing Page Startup</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Konfigurasi Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-300">

    
    <!-- 1. NAVBAR -->
    <nav class="sticky top-0 z-50 bg-slate-200 dark:bg-slate-900 border-b border-slate-300 dark:border-slate-800">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">

            <div class="flex items-center justify-between">

                <!-- Logo -->
                <h1 class="text-xl font-bold text-indigo-400">
                    TechNova.AI
                </h1>

                <!-- Link Desktop -->
                <div class="hidden md:flex items-center gap-8 text-sm text-slate-800 dark:text-slate-300">
                    <a href="#hero" class="hover:text-indigo-400">Beranda</a>
                    <a href="#features" class="hover:text-indigo-400">Fitur</a>
                    <a href="#pricing" class="hover:text-indigo-400">Harga</a>
                </div>

                <!-- Tombol -->
                <div class="flex items-center gap-3">

                    <!-- Dark Mode -->
                    <button id="themeButton" onclick="toggleTheme()"
                        class="px-3 py-2 rounded-lg bg-slate-300 dark:bg-slate-800 hover:bg-slate-400 dark:hover:bg-slate-700">
                        ☀
                    </button>

                    <!-- Burger -->
                    <button onclick="document.getElementById('menu').classList.toggle('hidden')"
                        class="md:hidden px-3 py-2 rounded-lg bg-slate-300 dark:bg-slate-800 hover:bg-slate-400 dark:hover:bg-slate-700">
                        ☰
                    </button>

                    <!-- CTA -->
                    <a href="#pricing"
                        class="hidden sm:block bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg text-sm text-white">
                        Coba Gratis
                    </a>

                </div>
            </div>

            <!-- Menu Dropdown Mobile -->
            <div id="menu"
                class="hidden flex flex-col gap-4 mt-4 p-4 bg-slate-300 dark:bg-slate-800 rounded-xl text-sm text-slate-800 dark:text-slate-300">

                <a href="#hero" class="hover:text-indigo-400">Beranda</a>
                <a href="#features" class="hover:text-indigo-400">Fitur</a>
                <a href="#pricing" class="hover:text-indigo-400">Harga</a>

            </div>
        </div>
    </nav>



</body>
</html>
